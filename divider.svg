<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="Séparateur : un paquet qui traverse quelques routeurs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pkt{animation:run 5s linear infinite}
    @keyframes run{from{transform:translateX(-450px)}to{transform:translateX(450px)}}
    @media (prefers-reduced-motion:reduce){.pkt{animation:none}}
  </style>
  <line x1="0" y1="12" x2="900" y2="12" stroke="#7d8799" stroke-opacity=".35"/>
  <g fill="none" stroke="#7d8799" stroke-opacity=".6">
    <rect x="96" y="8" width="8" height="8" rx="2"/>
    <rect x="276" y="8" width="8" height="8" rx="2"/>
    <rect x="446" y="8" width="8" height="8" rx="2"/>
    <rect x="616" y="8" width="8" height="8" rx="2"/>
    <rect x="796" y="8" width="8" height="8" rx="2"/>
  </g>
  <g class="pkt">
    <circle cx="450" cy="12" r="7" fill="#22b8e0" fill-opacity=".22"/>
    <circle cx="450" cy="12" r="3" fill="#22b8e0"/>
  </g>
</svg>
