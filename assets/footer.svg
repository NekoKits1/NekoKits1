<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-labelledby="t d">
<title id="t">End of profile</title>
<desc id="d">Connection closed. Session terminated.</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#8b949e}.cy{fill:#a855f7}.fg{fill:#c9d1d9}.gr{fill:#3fb950}.wh{fill:#f0fbff}.pk{fill:#ec4899}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>

</defs>
<path d="M16 -40V184M864 -40V184M16 184H864" fill="none" stroke="#a855f7" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="184" fill="#03040a"/>
<rect x="16" y="0" width="848" height="184" fill="url(#grid)"/>
<g class="ln" style="animation-delay:0.22s"><text x="52" y="36" class="dim"><tspan class="gr">you@kali:~$</tspan> exit</text></g>
<g class="ln" style="animation-delay:0.34s"><text x="52" y="58" class="dim">logout</text></g>
<g class="ln" style="animation-delay:0.46s"><text x="52" y="80" class="dim">Connection to <tspan class="cy">192.168.1.105</tspan> closed.</text></g>
<g class="ln" style="animation-delay:0.58s"><text x="52" y="102" class="dim"><tspan class="gr">[*]</tspan> Session terminated by user.</text></g>
<g class="ln" style="animation-delay:0.70s"><text x="52" y="124" class="dim"><tspan class="gr">[*]</tspan> Cleanup complete. Logs wiped.</text></g>
<g class="ln" style="animation-delay:.9s">
<line x1="52" y1="156" x2="262" y2="156" stroke="#a855f7" stroke-opacity=".4"/>
<text x="440" y="160" text-anchor="middle" letter-spacing="2" fill="#a855f7" style="font-size:11px">BUILD . EXPLOIT . DEFEND . STAY VIGILANT</text>
<line x1="618" y1="156" x2="828" y2="156" stroke="#a855f7" stroke-opacity=".4"/>
</g>
<rect x="16" y="150" width="848" height="34" fill="#a855f7" fill-opacity=".08"/>
<line x1="16" y1="150" x2="864" y2="150" stroke="#a855f7" stroke-opacity=".5"/>
<text x="32" y="172" letter-spacing="2" class="cy" style="font-size:13px">&#9679; &#9679; &#9679;</text>
<text x="844" y="172" letter-spacing="1" class="dim" text-anchor="end" style="font-size:12px">DISCONNECTED</text>
<circle cx="721.6" cy="166" r="4" fill="#484f58"/>
<path d="M16 0V184M864 0V184M16 184H864" fill="none" stroke="#a855f7" stroke-width="1.2"/>
<g fill="none" stroke="#a855f7" stroke-width="2"><path d="M9 166V191H34"/><path d="M846 191H871V166"/></g>
</svg>
