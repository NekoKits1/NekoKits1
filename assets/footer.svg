<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-label="logout : connexion fermée, merci d'être passé" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cur{animation:none}}
  </style>
  <rect width="900" height="96" rx="14" fill="#0d1017"/>
  <text x="28" y="38" font-size="16" fill="#d7dde8"><tspan fill="#4cc9f0">$</tspan> logout</text>
  <text x="28" y="66" font-size="16" fill="#aab4c5">Connection closed. Merci d'être passé, bon courage pour ton prochain lab.</text>
  <rect class="cur" x="28" y="76" width="10" height="4" fill="#4cc9f0"/>
</svg>
