<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-label="logout : connexion fermée, merci d'être passé" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a24"/>
      <stop offset="1" stop-color="#0a0614"/>
    </linearGradient>
    <style>
      text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
      .cur{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.cur{animation:none}}
    </style>
  </defs>
  <rect width="900" height="96" rx="14" fill="url(#fbg)"/>
  <rect x="0.5" y="0.5" width="899" height="95" rx="13.5" fill="none" stroke="#2f1f4d"/>
  <text x="28" y="38" font-size="16" fill="#ece6f7"><tspan fill="#b166ff">$</tspan> logout</text>
  <text x="28" y="66" font-size="15" fill="#b7a9dd">Connection closed. Merci d'être passé — bon courage pour ton prochain lab.</text>
  <rect class="cur" x="28" y="76" width="10" height="4" fill="#b166ff"/>
</svg>
