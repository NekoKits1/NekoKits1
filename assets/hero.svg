<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="ttl desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttl">Audrey Kitio, élève-ingénieure réseaux, cloud, cybersécurité — purple team</title>
  <desc id="desc">Terminal cyberpunk violet avec une grille en perspective, un prompt whoami, le nom, trois étiquettes red team / blue team / cloud, puis l'objectif de stage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a24"/>
      <stop offset="1" stop-color="#0a0614"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b166ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b166ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="340" rx="14"/></clipPath>
    <style>
      text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
      .l{animation:in .5s ease both}
      @keyframes in{from{opacity:0}to{opacity:1}}
      .cur{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .glow{filter:drop-shadow(0 0 6px rgba(177,102,255,.55))}
      @media (prefers-reduced-motion:reduce){.l,.cur{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="340" fill="url(#bg)"/>

    <!-- grille cyberpunk en perspective -->
    <g stroke="#2f1f4d" stroke-width="1" opacity=".55">
      <line x1="0" y1="300" x2="900" y2="300"/>
      <line x1="60" y1="300" x2="-180" y2="340"/>
      <line x1="220" y1="300" x2="100" y2="340"/>
      <line x1="380" y1="300" x2="340" y2="340"/>
      <line x1="450" y1="300" x2="450" y2="340"/>
      <line x1="520" y1="300" x2="560" y2="340"/>
      <line x1="680" y1="300" x2="800" y2="340"/>
      <line x1="840" y1="300" x2="1080" y2="340"/>
    </g>
    <rect x="0" y="230" width="900" height="70" fill="url(#horizon)"/>

    <!-- barre de titre -->
    <path d="M0 14A14 14 0 0 1 14 0H886A14 14 0 0 1 900 14V38H0Z" fill="#180f2b"/>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#2f1f4d"/>
    <circle cx="26" cy="19" r="6" fill="#39203f"/>
    <circle cx="48" cy="19" r="6" fill="#39203f"/>
    <circle cx="70" cy="19" r="6" fill="#39203f"/>
    <text x="450" y="24" text-anchor="middle" font-size="13" fill="#9686c2">neko@efrei: ~/audrey · purple-team</text>

    <text class="l" style="animation-delay:.3s" x="28" y="84" font-size="16" fill="#ece6f7"><tspan fill="#b166ff">$</tspan> whoami</text>
    <text class="l glow" style="animation-delay:.9s" x="28" y="138" font-size="38" font-weight="700" fill="#f4eeff">Audrey Kitio</text>
    <text class="l" style="animation-delay:1.2s" x="28" y="166" font-size="15" fill="#b7a9dd">élève-ingénieure EFREI Paris · réseaux, cloud, cybersécurité</text>

    <!-- étiquettes red/blue/cloud -->
    <g class="l" style="animation-delay:1.7s" font-size="12" font-weight="600">
      <rect x="28" y="182" width="86" height="24" rx="12" fill="#2a0f1f" stroke="#ff3d7f"/>
      <text x="71" y="198" text-anchor="middle" fill="#ff3d7f">red team</text>
      <rect x="124" y="182" width="90" height="24" rx="12" fill="#0b2a2d" stroke="#39e6e0"/>
      <text x="169" y="198" text-anchor="middle" fill="#39e6e0">blue team</text>
      <rect x="224" y="182" width="66" height="24" rx="12" fill="#1c1030" stroke="#b166ff"/>
      <text x="257" y="198" text-anchor="middle" fill="#b166ff">cloud</text>
    </g>

    <text class="l" style="animation-delay:2.2s" x="28" y="246" font-size="16" fill="#ece6f7"><tspan fill="#b166ff">$</tspan> cat objectif.txt</text>
    <text class="l" style="animation-delay:2.7s" x="28" y="274" font-size="16" fill="#ffd166">stage de 3 mois à partir d'août 2027</text>
    <text class="l" style="animation-delay:3s" x="28" y="298" font-size="14" fill="#b7a9dd">je monte des archis, je les attaque, puis j'apprends à les défendre.</text>

    <text class="l" style="animation-delay:3.5s" x="28" y="324" font-size="16" fill="#b166ff">$</text>
    <rect class="cur" x="46" y="310" width="10" height="18" fill="#b166ff"/>
  </g>
</svg>
