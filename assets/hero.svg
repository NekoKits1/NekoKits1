<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="ttl desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttl">Audrey Kitio, élève-ingénieure réseaux, cloud et cybersécurité</title>
  <desc id="desc">Fenêtre de terminal : whoami, le nom, puis la recherche d'un stage de 3 mois à partir d'août 2027.</desc>
  <style>
    text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
    .l{animation:in .45s ease both}
    @keyframes in{from{opacity:0}to{opacity:1}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l,.cur{animation:none}}
  </style>
  <rect width="900" height="330" rx="14" fill="#0d1017"/>
  <path d="M0 14A14 14 0 0 1 14 0H886A14 14 0 0 1 900 14V40H0Z" fill="#151a26"/>
  <line x1="0" y1="40" x2="900" y2="40" stroke="#222a3c"/>
  <circle cx="26" cy="20" r="6" fill="#2b3347"/>
  <circle cx="48" cy="20" r="6" fill="#2b3347"/>
  <circle cx="70" cy="20" r="6" fill="#2b3347"/>
  <text x="450" y="25" text-anchor="middle" font-size="13" fill="#7d8799">neko@efrei: ~/audrey</text>

  <text class="l" style="animation-delay:.3s" x="28" y="86" font-size="16" fill="#d7dde8"><tspan fill="#4cc9f0">$</tspan> whoami</text>
  <text class="l" style="animation-delay:.9s" x="28" y="142" font-size="40" font-weight="700" fill="#f2f5fa">Audrey Kitio</text>
  <text class="l" style="animation-delay:1.2s" x="28" y="172" font-size="16" fill="#aab4c5">élève-ingénieure à l'EFREI Paris : réseaux, cloud, cybersécurité</text>

  <text class="l" style="animation-delay:1.9s" x="28" y="220" font-size="16" fill="#d7dde8"><tspan fill="#4cc9f0">$</tspan> cat objectif.txt</text>
  <text class="l" style="animation-delay:2.5s" x="28" y="250" font-size="16" fill="#ffb454">stage de 3 mois à partir d'août 2027</text>
  <text class="l" style="animation-delay:2.8s" x="28" y="274" font-size="16" fill="#aab4c5">Je monte des labs, je les casse, puis j'apprends à les défendre.</text>

  <text class="l" style="animation-delay:3.4s" x="28" y="312" font-size="16" fill="#4cc9f0">$</text>
  <rect class="cur" x="46" y="298" width="10" height="18" fill="#4cc9f0"/>
</svg>
