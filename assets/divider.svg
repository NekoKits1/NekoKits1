<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 26" width="900" height="26" role="img" aria-label="Séparateur : un paquet violet qui traverse des nœuds réseau" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pkt{animation:run 5.5s linear infinite}
    @keyframes run{from{transform:translateX(-450px)}to{transform:translateX(450px)}}
    @media (prefers-reduced-motion:reduce){.pkt{animation:none}}
  </style>
  <line x1="0" y1="13" x2="900" y2="13" stroke="#5a4482" stroke-opacity=".5"/>
  <g fill="none" stroke="#7a5fb3" stroke-opacity=".7">
    <rect x="96" y="9" width="8" height="8" rx="2"/>
    <rect x="276" y="9" width="8" height="8" rx="2"/>
    <rect x="446" y="9" width="8" height="8" rx="2"/>
    <rect x="616" y="9" width="8" height="8" rx="2"/>
    <rect x="796" y="9" width="8" height="8" rx="2"/>
  </g>
  <g class="pkt">
    <circle cx="450" cy="13" r="8" fill="#b166ff" fill-opacity=".25"/>
    <circle cx="450" cy="13" r="3.2" fill="#d9b3ff"/>
  </g>
</svg>
